name: Build Android APK Release

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release APK with embedded JavaScript
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK contains JavaScript bundle
        run: unzip -l apps/mobile/android/app/build/outputs/apk/release/app-release.apk | grep 'assets/index.android.bundle'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fretes-app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
